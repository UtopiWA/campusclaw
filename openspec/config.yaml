schema: spec-driven

context: |
  CampusClaw 是面向中小学班级场景的教研智能体平台，当前已具备账号登录、教师/学生角色权限、服务端班级隔离，以及教师上传教学材料并写入知识库的基础实现。
  当前 change 同时覆盖材料上传、同班在线查看与原文件下载；教师可以管理材料，学生保持只读。
  参考技术栈为 Vue 3、Vite、Java 17、Spring Boot 3、MySQL 8、服务端会话和 Docker Compose；首版只解析 .txt 与 .md。
  班级是数据边界，所有业务读写都必须使用会话中的 class_id；客户端不得指定或覆盖数据所属班级。
  密码必须哈希存储，数据库凭据、演示种子口令等敏感配置必须来自服务端环境变量。
  规约变更必须先于实现；实现完成后按 tasks.md 逐项验证，且不得提交真实密钥或生成数据。

rules:
  proposal:
    - 必须分别写清 Why、What Changes、Capabilities、Impact 和 Non-goals。
    - Non-goals 必须排除检索问答、AI 对话、作业流程、注册找回、SSO、多租户和生产级高可用。
  design:
    - 明确会话与密码方案、服务端 class_id 隔离、材料上传/查看/下载、失败清理、数据模型、Compose 持久化及 GET /health。
    - 文件响应不得暴露服务端存储路径；在线查看必须使用不可执行的纯文本响应，下载必须保留安全处理后的原文件名。
    - 记录重要备选方案和取舍，不把前端隐藏控件视为授权措施。
  specs:
    - 每个 Requirement 至少包含一个可直接判定通过或失败的 Scenario。
    - 同时覆盖成功、未认证、越权、跨班、非法上传和失败回滚等路径。
  tasks:
    - 按骨架、数据、登录、隔离、材料文件生命周期、Compose、界面和校验的依赖顺序分节。
    - 每个任务都必须附带可执行的 verify，初始 checkbox 全部保持为未勾选状态。

operations:
  apply:
    guidance:
      - 严格按 tasks.md 顺序实现，并在每项验证通过后再勾选。
      - 不得绕过 spec 中的服务端权限、班级隔离和失败回滚要求。
